name: Feature request
description: Suggest a change to LuxxWallet and explain how it would help.
title: "[Feature] "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        This request will be public. Search existing requests first.

        Never include recovery words, passwords, private keys, recovery codes, tokens, authentication links, or backup files—even encrypted ones. Do not include wallet addresses, transaction IDs, balances, personal contact details, full URLs, console dumps or network captures.

        For a suspected security flaw, use the [private security form](https://github.com/luxxfolio/luxxwallet-feedback/security/advisories/new).
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Wallet setup or unlock
        - Backup and recovery
        - Balances and activity
        - Receiving coins
        - Sending coins
        - LuxxPool connection
        - Accounts
        - Display or accessibility
        - Other or unsure
    validations:
      required: true
  - type: dropdown
    id: coin_network
    attributes:
      label: Coin and network
      description: Select each relevant network. Do not enter an address or transaction ID.
      multiple: true
      options:
        - Not coin-specific
        - LTC mainnet
        - Litecoin testnet
        - DOGE mainnet
        - BELLS mainnet
        - LKY mainnet
        - PEP mainnet
        - JKC mainnet
        - DINGO mainnet
        - SHIC mainnet
        - CRC mainnet
        - TRMP mainnet
        - Other or unsure
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      description: Where would you use this? Enter Not device-specific if it applies everywhere. Leave out identifying device details.
      placeholder: "Safari on iPhone (iOS), or Not device-specific"
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Current behavior or problem
      description: What is missing or difficult today? Explain the problem without private wallet or account details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Requested behavior
      description: What should change, and how would that help?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Example flow
      description: Describe the steps someone would take to use this feature. Use placeholders instead of real data.
      placeholder: |
        1. Open ...
        2. Select ...
        3. The wallet should ...
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: Redacted screenshot or sketch (optional)
      description: Remove wallet names, account details, addresses, balances, QR codes, secrets and full URLs. Never attach a wallet backup or network capture.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I understand this request is public and have removed wallet secrets, backup files, private financial information and personal details.
          required: true
