name: Feature request
description: Share an idea for LuxxWallet.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        This post is public. Never share recovery words, passwords, keys, recovery codes, tokens, backup files or raw logs. Keep personal and wallet details out, including screenshots.
        
        Security concern? Use the [private security form](https://github.com/luxxfolio/luxxwallet-feedback/security/advisories/new).
  - type: textarea
    id: description
    attributes:
      label: What's your idea?
      description: Describe what you would like to change and how it would help. An example or screenshot is optional.
      placeholder: "For example: Let me hide coins I don't use so the overview is easier to scan."
    validations:
      required: true
