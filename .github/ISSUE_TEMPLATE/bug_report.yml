name: Bug report
description: Tell us something is not working.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        This post is public. Never share recovery words, passwords, keys, recovery codes, tokens, backup files or raw logs. Keep personal and wallet details out, including screenshots.
        
        Security concern? Use the [private security form](https://github.com/luxxfolio/luxxwallet-feedback/security/advisories/new).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Tell us what went wrong and what you expected. Steps, the coin, your device/browser, or a screenshot are optional.
      placeholder: "For example: I switched wallets, but the balance still showed the previous wallet."
    validations:
      required: true
